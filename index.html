<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumit Bhumihar SMS - SMM Panel | Payment & Orders</title>
    <style>
        :root {
            --primary: #6c3ec7;
            --primary-light: #8b5cf6;
            --primary-dark: #4c1d95;
            --secondary: #ec4899;
            --accent: #f59e0b;
            --whatsapp: #25d366;
            --instagram: #e4405f;
            --telegram: #0088cc;
            --bg: #f8f7fc;
            --card-bg: #ffffff;
            --text: #1a1a2e;
            --text-light: #6b7280;
            --danger: #ef4444;
            --success: #10b981;
            --gradient-1: linear-gradient(135deg, #6c3ec7, #ec4899);
            --gradient-2: linear-gradient(135deg, #1e3a8a, #06b6d4);
            --gradient-3: linear-gradient(135deg, #ea580c, #ef4444);
            --gradient-4: linear-gradient(135deg, #059669, #10b981);
            --gradient-5: linear-gradient(135deg, #1a1a2e, #b45309);
            --gradient-6: linear-gradient(135deg, #be185d, #f43f5e);
            --gradient-insta: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            --gradient-telegram: linear-gradient(135deg, #0088cc, #00b4d8);
            --gradient-gold: linear-gradient(135deg, #f59e0b, #ef4444, #6c3ec7);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: var(--transition);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .theme-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transition: background 0.8s ease;
        }
        body.theme-0 .theme-wrapper {
            background: linear-gradient(135deg, #6c3ec71a, #ec48991a, #f8f7fc 60%);
        }
        body.theme-1 .theme-wrapper {
            background: linear-gradient(135deg, #1e3a8a1a, #06b6d41a, #f0f9ff 60%);
        }
        body.theme-2 .theme-wrapper {
            background: linear-gradient(135deg, #ea580c1a, #ef44441a, #fff7ed 60%);
        }
        body.theme-3 .theme-wrapper {
            background: linear-gradient(135deg, #0596691a, #10b9811a, #ecfdf5 60%);
        }
        body.theme-4 .theme-wrapper {
            background: linear-gradient(135deg, #1a1a2e1a, #b453091a, #fefce8 60%);
        }
        body.theme-5 .theme-wrapper {
            background: linear-gradient(135deg, #be185d1a, #f43f5e1a, #fff1f2 60%);
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.15;
            animation: floatParticle 15s infinite ease-in-out;
        }
        @keyframes floatParticle {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            25% {
                transform: translateY(-30px) rotate(90deg);
            }
            50% {
                transform: translateY(-60px) rotate(180deg);
            }
            75% {
                transform: translateY(-30px) rotate(270deg);
            }
        }

        .main-container {
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logoShine 3s infinite;
        }
        .logo-icon {
            font-size: 36px;
            -webkit-text-fill-color: initial;
            animation: bounceLogo 2s infinite;
        }
        @keyframes bounceLogo {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        @keyframes logoShine {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.2);
            }
        }
        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-link {
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 50px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 3px;
            border-radius: 10px;
            background: var(--gradient-gold);
            transition: all 0.4s ease;
            transform: translateX(-50%);
        }
        .nav-link:hover::after {
            width: 80%;
        }
        .nav-link:hover {
            background: rgba(108, 62, 199, 0.08);
            transform: translateY(-2px);
        }
        .nav-link.active-link {
            background: var(--gradient-gold);
            color: #fff;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
            position: relative;
            animation: fadeInUp 0.8s ease;
        }
        .hero-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            background: var(--gradient-gold);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            animation: pulseBadge 2s infinite;
            box-shadow: 0 8px 25px rgba(108, 62, 199, 0.3);
        }
        @keyframes pulseBadge {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 8px 25px rgba(108, 62, 199, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 12px 35px rgba(108, 62, 199, 0.5);
            }
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 15px;
            background: var(--gradient-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: textGlow 3s infinite;
        }
        @keyframes textGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 10px rgba(108, 62, 199, 0.3));
            }
            50% {
                filter: drop-shadow(0 0 25px rgba(108, 62, 199, 0.6));
            }
        }
        .hero p {
            font-size: 17px;
            color: var(--text-light);
            max-width: 700px;
            margin: 0 auto 25px;
            line-height: 1.7;
        }
        .hero-cta {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 16px 35px;
            border-radius: 50px;
            border: none;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: var(--gradient-gold);
            color: #fff;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(108, 62, 199, 0.35);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 45px rgba(108, 62, 199, 0.5);
        }
        .btn-secondary {
            padding: 16px 35px;
            border-radius: 50px;
            border: 2px solid var(--primary);
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            background: transparent;
            color: var(--primary);
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .btn-secondary:hover {
            background: var(--primary);
            color: #fff;
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(108, 62, 199, 0.3);
        }

        /* Marquee */
        .marquee-section {
            padding: 15px 0;
            background: var(--gradient-gold);
            overflow: hidden;
            margin: 10px 0;
        }
        .marquee-content {
            display: flex;
            animation: marquee 20s linear infinite;
            white-space: nowrap;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            letter-spacing: 2px;
        }
        .marquee-content span {
            padding: 0 25px;
        }
        @keyframes marquee {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        /* Payment Notice */
        .payment-notice {
            text-align: center;
            padding: 20px 30px;
            margin: 25px auto;
            max-width: 900px;
            background: #fff;
            border-radius: 25px;
            box-shadow: var(--shadow-lg);
            border: 3px dashed var(--primary);
            position: relative;
            animation: pulseBorder 2s infinite;
        }
        @keyframes pulseBorder {
            0%,
            100% {
                border-color: var(--primary);
                box-shadow: 0 10px 40px rgba(108, 62, 199, 0.2);
            }
            50% {
                border-color: var(--accent);
                box-shadow: 0 15px 50px rgba(245, 158, 11, 0.3);
            }
        }
        .payment-notice h3 {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .payment-notice p {
            font-size: 15px;
            color: var(--text-light);
            line-height: 1.6;
        }
        .upi-highlight {
            font-size: 26px;
            font-weight: 900;
            color: var(--primary);
            background: #f5f3ff;
            padding: 10px 25px;
            border-radius: 15px;
            display: inline-block;
            margin: 10px 0;
            cursor: pointer;
            user-select: all;
            transition: var(--transition);
        }
        .upi-highlight:hover {
            background: #ede9fe;
            transform: scale(1.05);
        }
        .font-note {
            background: #fefce8;
            border: 2px solid #f59e0b;
            border-radius: 15px;
            padding: 12px 18px;
            margin-top: 12px;
            font-weight: 600;
            color: #92400e;
            font-size: 15px;
            animation: fontPulse 2s infinite;
        }
        @keyframes fontPulse {
            0%,
            100% {
                background: #fefce8;
            }
            50% {
                background: #fef3c7;
            }
        }

        /* Payment Add Section */
        .payment-add-section {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            text-align: center;
            border: 2px solid var(--accent);
        }
        .payment-add-section h3 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--primary);
        }
        .payment-add-section p {
            font-size: 15px;
            color: var(--text-light);
            margin-bottom: 20px;
        }
        .amount-presets {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .amount-btn {
            padding: 12px 22px;
            border-radius: 30px;
            border: 2px solid var(--primary);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: #fff;
            color: var(--primary);
            transition: var(--transition);
        }
        .amount-btn:hover,
        .amount-btn.selected {
            background: var(--primary);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(108, 62, 199, 0.3);
        }
        .custom-amount-input {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .custom-amount-input input {
            padding: 14px 20px;
            border-radius: 30px;
            border: 2px solid #ddd;
            font-size: 18px;
            font-weight: 700;
            width: 200px;
            text-align: center;
            transition: var(--transition);
            outline: none;
        }
        .custom-amount-input input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(108, 62, 199, 0.15);
        }
        .btn-pay-now {
            padding: 16px 40px;
            border-radius: 50px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            background: var(--gradient-gold);
            color: #fff;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(108, 62, 199, 0.35);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }
        .btn-pay-now:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 18px 45px rgba(108, 62, 199, 0.5);
        }

        /* Custom Order Form */
        .custom-order-section {
            max-width: 800px;
            margin: 30px auto;
            padding: 35px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 2px solid var(--instagram);
        }
        .custom-order-section h3 {
            font-size: 26px;
            font-weight: 900;
            margin-bottom: 5px;
            text-align: center;
            background: var(--gradient-insta);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .custom-order-section .sub-text {
            text-align: center;
            color: var(--text-light);
            font-size: 15px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 18px;
            border-radius: 15px;
            border: 2px solid #ddd;
            font-size: 15px;
            font-family: inherit;
            transition: var(--transition);
            outline: none;
            background: #fafafa;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--instagram);
            box-shadow: 0 0 20px rgba(220, 39, 67, 0.15);
            background: #fff;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .btn-submit-order {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            background: var(--gradient-insta);
            color: #fff;
            transition: var(--transition);
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.35);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-submit-order:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 18px 45px rgba(220, 39, 67, 0.5);
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 25px 20px 10px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 14px 30px;
            border-radius: 50px;
            border: none;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
            background: #fff;
            box-shadow: var(--shadow);
            color: var(--text);
        }
        .tab-btn.instagram-tab {
            background: var(--gradient-insta);
            color: #fff;
            box-shadow: 0 10px 30px rgba(220, 39, 67, 0.3);
        }
        .tab-btn.instagram-tab:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 18px 45px rgba(220, 39, 67, 0.5);
        }
        .tab-btn.telegram-tab {
            background: var(--gradient-telegram);
            color: #fff;
            box-shadow: 0 10px 30px rgba(0, 136, 204, 0.3);
        }
        .tab-btn.telegram-tab:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 18px 45px rgba(0, 136, 204, 0.5);
        }
        .tab-btn.custom-tab {
            background: var(--gradient-gold);
            color: #fff;
            box-shadow: 0 10px 30px rgba(108, 62, 199, 0.3);
        }
